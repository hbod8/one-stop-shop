openapi: 3.0.3
info:
  title: One Stop Shop API
  description: A simple ecommerce application.
  version: 0.0.1

security:
  - bearerAuth: []

paths:
  /products:
    get:
      security: []
      summary: Get all products
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '204':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - description
                - price
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: integer
                  format: int64
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /products/{id}:
    get:
      security: []
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/ProductNotFoundError'
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login, returns a JWT token
          content:
            application/json:
              schema:
                required:
                  - token
                  - refreshToken
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    enum:
                      - The provided username or password is incorrect
                    x-enum-varnames:
                      - InvalidCredentialsMessage
        '400':
          $ref: '#/components/responses/BadRequestError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      required:
        - id
        - name
        - description
        - price
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
    UnauthorizedError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - The access token is missing or invalid
            - The access token has expired
          x-enum-varnames:
            - MissingOrInvalidTokenUnauthorizedErrorMessage
            - ExpiredTokenUnauthorizedErrorMessage
    BadRequestError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - The request body is missing
            - The request body is malformed
            - The request body ended unexpectedly
            - The request body contained invalid types
            - The request timed out
          x-enum-varnames:
            - MissingRequestBadRequestMessage
            - MalformedRequestBadRequestMessage
            - UnexpectedEndOfRequestBadRequestMessage
            - InvalidTypesInRequestBadRequestMessage
            - RequestTimedOutBadRequestMessage
    ProductNotFoundError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - The product with the specified ID was not found
          x-enum-varnames:
            - ProductNotFoundErrorMessage
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    BadRequestError:
      description: The request was invalid or cannot be otherwise served
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    ProductNotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductNotFoundError'
